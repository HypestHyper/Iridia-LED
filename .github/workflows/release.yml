name: Release

# Publishes a release: the source archive without tests, and the notes from that version's section in
# CHANGELOG.md. Either push a tag like v1.1.1, or run this workflow by hand (Actions tab, Release, Run
# workflow): it then tags the current commit with the version in pyproject.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pyproject.toml's version $v"; exit 1
          fi
          grep -q "^## $v\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the archive
        run: git archive --format=tar.gz --prefix=iridia/ -o "iridia-$VERSION.tar.gz" HEAD
      - name: Write the release notes
        run: |
          awk -v head="## $VERSION" '$0 == head {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install or update

              tar xzf iridia-$VERSION.tar.gz
              cd iridia
              bash install.sh

          Or from git: \`git clone https://github.com/${GITHUB_REPOSITORY}.git\`, then \`bash install.sh\` in that folder
          (to update an existing clone: \`git pull && bash install.sh\`). Your settings are kept.
          See the [installation guide](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/docs/wiki/Installation.md).
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"; exit 1
          fi
          gh release create "v$VERSION" "iridia-$VERSION.tar.gz" --title "Iridia $VERSION" \
            --notes-file notes.md --target "$GITHUB_SHA"
