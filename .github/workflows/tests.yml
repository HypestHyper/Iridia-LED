name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # Mondays: Arch's new Plasma and GTK show up here even without a push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3          # pinned: a new ruff's new rules shouldn't turn CI red by themselves
      - run: ruff check iridia scripts tests
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh tests/validate-desktop.sh tests/desktop/run.sh packaging/*.sh packaging/scripts/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Byte-compile every module (catches syntax newer than the oldest supported Python)
        run: python -m compileall -q iridia scripts
      - run: pytest -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the validators
        run: sudo apt-get update -q && sudo apt-get install -y -q desktop-file-utils appstream libglib2.0-bin
      - name: Desktop entry, metadata, icons and versions
        run: sh tests/validate-desktop.sh

  desktop:
    # A real KWin (headless): scenes' focus watcher with a real window, then the window itself against
    # the daemon and the fake OpenRGB, every tab at every size (tests/desktop/run.sh). Arch has the
    # newest Plasma and GTK, Ubuntu 24.04 Plasma 5 and an older GTK. A new Arch package can break
    # this without anything changing here, so that row may fail without failing the run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "ubuntu:24.04"]
    continue-on-error: ${{ matrix.image == 'archlinux:latest' }}
    container: ${{ matrix.image }}
    steps:
      - name: Install KWin, GTK 4 and Python
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed git kwin python python-gobject python-cairo gtk4 python-pillow \
              python-watchdog glib2 dbus
          else
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git ca-certificates \
              kwin-wayland python3-venv python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 python3-pil \
              python3-watchdog dbus libglib2.0-bin
          fi
      - uses: actions/checkout@v7
      - name: Install Iridia
        run: |
          python3 -m venv --system-site-packages /tmp/venv
          /tmp/venv/bin/pip install -q -e .
      - name: Desktop checks
        run: sh tests/desktop/run.sh /tmp/venv/bin/python

  packages:
    # The system packages a release attaches: the .deb and .rpm (nfpm) and the Arch package (makepkg
    # in an Arch container), from the same layout (packaging/stage.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
      - name: .deb and .rpm
        run: NFPM="$(go env GOPATH)/bin/nfpm" sh packaging/build.sh dist
      - name: Arch package
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest sh -c \
            'pacman -Syu --noconfirm --needed base-devel git >/dev/null && git config --global --add safe.directory /src && sh packaging/arch-build.sh dist'
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          retention-days: 7

  package-install:
    # Each package installed on a fresh system with its dependencies from the distribution: the
    # command line, the daemon, the window on a virtual display, an upgrade, and removing it.
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "archlinux:latest", file: "*.pkg.tar.zst"}
          - {image: "ubuntu:24.04", file: "*.deb"}
          - {image: "debian:trixie", file: "*.deb"}
          - {image: "fedora:latest", file: "*.rpm"}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - name: Install, use, upgrade and remove it
        run: sh packaging/test-install.sh dist/${{ matrix.file }}
