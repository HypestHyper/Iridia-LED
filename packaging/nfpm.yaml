# The .deb and .rpm packages, from the tree stage.sh lays out (build.sh runs both). The Arch package
# is made by makepkg from arch/PKGBUILD, which uses stage.sh too.
# https://nfpm.goreleaser.com/configuration/
name: iridia
arch: all
platform: linux
version: "@VERSION@"
release: 1
section: utils
priority: optional
maintainer: HypestHyper <32564039+HypestHyper@users.noreply.github.com>
description: |
  Set RGB lights from the colours of your wallpaper, through OpenRGB
  Animations, a map of your room, monitor brightness, sensors, notification flashes,
  scenes for fullscreen apps, and Philips WiZ and Govee lights on your Wi-Fi.
vendor: HypestHyper
homepage: https://github.com/HypestHyper/Iridia-LED
license: MIT

contents:
  - src: "@STAGE@/usr/"
    dst: /usr/
    type: tree

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

overrides:
  deb:
    depends:
      - python3 (>= 3.10)
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - python3-pil
      - python3-watchdog
    recommends:
      - openrgb
      - ddcutil
  rpm:
    depends:
      - python3 >= 3.10
      - python3-gobject
      - (python3-cairo or python3-pycairo)
      - (gtk4 or typelib-1_0-Gtk-4_0)
      - (python3-pillow or python3-Pillow)
      - python3-watchdog
    recommends:
      - openrgb
      - ddcutil

rpm:
  arch: noarch
  group: Applications/System
deb:
  arch: all
