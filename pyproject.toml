[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iridia"
version = "1.1.0"
description = "Sync your RGB lighting with your wallpaper on Linux, through OpenRGB"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Iridia Contributors"}]
classifiers = [
 "Development Status :: 5 - Production/Stable",
 "Environment :: X11 Applications :: GTK",
 "Intended Audience :: End Users/Desktop",
 "License :: OSI Approved :: MIT License",
 "Operating System :: POSIX :: Linux",
 "Programming Language :: Python :: 3",
 "Topic :: System :: Hardware",
]
dependencies = [
 "openrgb-python>=0.3.0",
 "Pillow>=9.0.0",
 "watchdog>=3.0.0",
]
# The window also needs GTK 4 with PyGObject and pycairo from your distribution
# (scripts/install.sh installs them and creates the venv with --system-site-packages).

[project.urls]
Homepage = "https://github.com/HypestHyper/Iridia-LED"
Documentation = "https://github.com/HypestHyper/Iridia-LED/blob/main/docs/wiki/Home.md"
Issues = "https://github.com/HypestHyper/Iridia-LED/issues"

[project.optional-dependencies]
material = ["material-color-utilities>=0.1.0"]

[project.scripts]
iridia-daemon = "iridia.daemon:main"
iridia = "iridia.cli:main"
iridia-gui = "iridia.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iridia*"]

[tool.setuptools.package-data]
iridia = ["data/*.svg", "data/*.png", "data/fonts/*", "data/locale/*/LC_MESSAGES/*.mo"]
