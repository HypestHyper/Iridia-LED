[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iridia"
version = "1.0.0"
description = "Standalone LED brightness sync for Linux — wallpaper colors to OpenRGB"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Iridia Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "openrgb-python>=0.3.0",
    "Pillow>=9.0.0",
    "watchdog>=3.0.0",
    "pystray>=0.19.0",
]

[project.optional-dependencies]
material = ["material-color-utilities>=0.1.0"]

[project.scripts]
iridia-daemon = "iridia.daemon:main"
iridia = "iridia.cli:main"
iridia-gui = "iridia.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iridia*"]
